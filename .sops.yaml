# SOPS + age (flanhub sops-secrets). secrets.enc.yaml holds this repo's
# secrets as KEY: value with values encrypted; keys stay readable so a diff
# shows names, never values. One recipient per machine; private keys never
# leave their machine. Add or drop a machine here, then
# `sops updatekeys secrets.enc.yaml`. Loaded by .envrc (direnv).
creation_rules:
  - path_regex: secrets\.enc\.yaml$
